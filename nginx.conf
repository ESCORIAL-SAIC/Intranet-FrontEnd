server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CVs, genoma y adjuntos del chat se suben por la API
    client_max_body_size 50m;

    # DNS interno de Docker: "api" se resuelve en cada request, asi nginx
    # arranca aunque el contenedor de la API todavia no este levantado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/<ruta> -> http://api:2223/<ruta>
    # ^~ para que la regex de estaticos de abajo nunca le gane a la API
    location ^~ /api/ {
        set $api_upstream http://api:2223;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las respuestas de los asistentes de OpenAI pueden tardar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # CSV del organigrama: no estan en git ni en la imagen, se montan desde
    # /opt/docker/intranet/organigrama (ver docker-compose.yml)
    location ^~ /organigrama/ {
        alias /usr/share/nginx/organigrama/;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo existente cae en index.html
    # (react-router-dom maneja el routing del lado del cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
